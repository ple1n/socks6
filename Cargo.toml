[package]
name = "socks6"
version = "0.1.0"
edition = "2021"
description = "Rust reference implementation of SOCKS6 protocol, NAT-aware SOCK5 analog that will work for UDP/TCP/Lokinet/Tor"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ple1n/socks6"

[dependencies]
bytes = "1.9"
tokio = { version = "1.43", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
binrw = "0.15.2"

[dev-dependencies]
