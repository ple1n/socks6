[package]
name = "socks6"
version = "0.1.0"
edition = "2021"
description = "Independent framed TCP and UDP proxy protocol"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ple1n/socks6"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.43", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
multiaddr = { version = "0.19.1", default-features = false }

[dev-dependencies]
